name: circulation
description: Application de signalement d'infractions et de circulation en Côte d'Ivoire.
publish_to: 'none'
version: 1.0.0+16

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Routing
  go_router: ^14.6.2

  # Networking
  http: ^1.2.2

  # Local storage
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # Camera & video
  camera: ^0.12.1
  video_player: ^2.9.2
  video_thumbnail:
    path: third_party/video_thumbnail

  # ML / OCR / detection
  google_mlkit_text_recognition: ^0.13.1
  tflite_flutter: ^0.12.1

  # Image processing
  image: ^4.3.0

  # Geolocation
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Files & sharing
  file_picker: ^13.1.0
  share_plus: ^13.3.1

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/detect.tflite
